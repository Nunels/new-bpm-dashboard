document:
  dsl: "1.0.0"
  namespace: test
  name: out-of-perimeter
  version: "1.0.0"
  summary: costrutti fuori perimetro, devono essere rifiutati all'avvio
do:
  - grpc:
      call: grpc
      with:
        proto:
          endpoint: file://x.proto
        service:
          name: S
          host: h
        method: m
  - race:
      fork:
        compete: true
        branches:
          - a:
              set:
                x: 1
  - any-event:
      listen:
        to:
          any: []
  - clock:
      set:
        at: ${ now }
  - broken:
      set:
        x: ${ .a | | }
  - jump:
      set:
        x: 1
      then: missing-task
