<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offer Process Designer — Catalogo</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Offer Process Designer</div>
    <nav class="tabs">
      <a href="index.html">Configurazione offerta</a>
      <a href="catalog.html" class="active">Catalogo prodotti &amp; task</a>
    </nav>
    <div class="spacer"></div>
    <button id="btn-export" title="Esporta tutta la configurazione (cataloghi + offerte)">⭳ Esporta</button>
    <label class="btn" title="Importa una configurazione esportata">⭱ Importa<input type="file" id="file-import" accept=".json,application/json" hidden></label>
    <button id="btn-reset" class="danger-outline">↺ Reset demo</button>
  </header>

  <main class="catalog-layout">
    <aside class="catalog-lists" id="lists"></aside>
    <section class="catalog-editor" id="editor"></section>
  </main>

  <script src="js/seed.js"></script>
  <script src="js/store.js"></script>
  <script src="js/catalog.js"></script>
</body>
</html>
