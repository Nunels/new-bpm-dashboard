quarkus.http.port=8090
quarkus.http.test-port=0
# la dashboard può essere aperta anche da file:// o da un'altra porta
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.limits.max-body-size=2M
# la home (/) è la pagina di generazione da specifiche
quarkus.http.static-resources.index-page=generate.html

# modello: la chiave arriva solo da variabile d'ambiente, mai dal browser
agent.gemini.api-key=${GEMINI_API_KEY:}
#agent.gemini.model=${GEMINI_MODEL:gemini-4-hydrogen}
#agent.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
agent.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
agent.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
agent.gemini.api-revision=2026-05-20
agent.gemini.timeout=PT120S
# log di ogni chiamata a Gemini: sempre metadati (stato, durata, token); con true anche prompt e risposte (solo dati fittizi!)
agent.gemini.log-payloads=${GEMINI_LOG_PAYLOADS:true}
quarkus.log.category."it.sim.agent.GeminiOfferModel".level=INFO
# tentativi totali (generazione + correzioni con gli errori di validazione)
agent.max-attempts=3
# seconda lettura della specifica contro la configurazione prodotta (task manuali su KO, SLA, retry, template...): costa una chiamata in più
agent.coverage-check=${AGENT_COVERAGE_CHECK:true}
# dimensione massima del file di specifiche (caratteri)
agent.max-spec-chars=60000

# GraalJS su JDK standard: niente compilazione JIT, va bene per questo carico
quarkus.log.category."org.graalvm".level=WARN
